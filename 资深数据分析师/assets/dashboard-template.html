<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#F5F7FB; --surface:#FFFFFF; --text:#0F172A; --muted:#8892A6;
    --primary:#1F4E9C; --secondary:#5B8DEF; --accent:#E8833A; --line:#E3E8F2;
    --radius:14px; --gap:20px; --pad:26px;
    --font: "PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1440px;margin:0 auto;padding:32px 32px 28px}
  /* 页头 */
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:24px}
  .head h1{font-size:28px;line-height:1.3;font-weight:800;letter-spacing:.2px}
  .head .sub{margin-top:8px;font-size:16px;color:var(--muted)}
  .meta{text-align:right;font-size:13px;line-height:1.9;color:var(--muted);white-space:nowrap}
  .meta b{color:var(--text);font-weight:600}
  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
  .kpi{position:relative;background:var(--surface);border-radius:var(--radius);padding:22px var(--pad) 20px;
    border:1px solid var(--line);overflow:hidden}
  .kpi.hl{border-color:var(--accent);box-shadow:0 6px 20px rgba(232,131,58,.14)}
  .kpi.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .kpi .lab{font-size:14px;color:var(--muted);margin-bottom:10px}
  .kpi .valrow{display:flex;align-items:baseline;gap:6px}
  .kpi .val{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .kpi .unit{font-size:16px;color:var(--muted);font-weight:600}
  .kpi .delta{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-size:14px;font-weight:700}
  .kpi .delta.up{color:var(--primary)} .kpi .delta.down{color:var(--accent)} .kpi .delta.flat,.kpi .delta.none{color:var(--muted)}
  .kpi .note{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.5}
  /* 区块 */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px var(--pad) 18px;display:flex;flex-direction:column}
  .card.span2{grid-column:span 2}
  .card h2{font-size:21px;line-height:1.4;font-weight:700}
  .card .cap{margin-top:6px;font-size:13px;color:var(--muted)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 2px;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .chart{margin:8px 0 4px;width:100%}
  .chart svg{display:block;width:100%;height:auto}
  .readout{border-top:1px dashed var(--line);padding-top:14px;margin-top:auto;display:grid;gap:7px}
  .readout .r{display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:15px;line-height:1.6;color:var(--text)}
  .readout .tag{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:4px;
    text-align:center;padding:2px 0;height:22px;line-height:18px}
  .readout .tag.c{color:#fff;background:var(--primary)}
  .foot{margin-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  /* 窄屏 */
  @media (max-width:1080px){
    .wrap{padding:24px 20px}
    .grid{grid-template-columns:1fr}
    .card.span2{grid-column:auto}
    .head h1{font-size:24px}
    .kpi .val{font-size:42px}
    .meta{text-align:left;white-space:normal}
  }
  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .card,.kpi{break-inside:avoid}
  }
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1 id="t-title"></h1>
      <div class="sub" id="t-sub"></div>
    </div>
    <div class="meta" id="t-meta"></div>
  </header>
  <section class="kpis" id="kpis"></section>
  <main class="grid" id="grid"></main>
  <footer class="foot">
    <span id="t-source"></span>
    <span id="t-footer"></span>
  </footer>
</div>
<script>
const DASHBOARD = __DASHBOARD_DATA__;

const THEMES = {
  'blue-orange':     {bg:'#F5F7FB', surface:'#FFFFFF', text:'#0F172A', muted:'#8892A6', primary:'#1F4E9C', secondary:'#5B8DEF', accent:'#E8833A', line:'#E3E8F2'},
  'ink-green':       {bg:'#F7F6F1', surface:'#FFFFFF', text:'#14211D', muted:'#7C8A85', primary:'#123B33', secondary:'#2F7A66', accent:'#C9A227', line:'#E7E3D6'},
  'graphite-violet': {bg:'#F4F4F8', surface:'#FFFFFF', text:'#1E2030', muted:'#8D99AE', primary:'#2B2D42', secondary:'#6C63FF', accent:'#FF8A5B', line:'#E4E5F0'},
  'slate-mono':      {bg:'#FFFFFF', surface:'#FAFAFA', text:'#1A1A1A', muted:'#6E6E6E', primary:'#1A1A1A', secondary:'#5A5A5A', accent:'#8C6A2F', line:'#DEDEDE'}
};
const THEME_SPACE = {'blue-orange':'26px','ink-green':'26px','graphite-violet':'16px','slate-mono':'28px'};

const SERIES_COLORS = ['var(--primary)','var(--secondary)','var(--accent)','var(--muted)','#B8C0D4'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => {
  if (typeof n !== 'number' || !isFinite(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '亿';
  if (abs >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'') + '万';
  return n.toLocaleString('zh-CN');
};

function applyTheme(spec){
  const base = THEMES[spec.theme] || THEMES['blue-orange'];
  const merged = Object.assign({}, base, spec.themeCustom || {});
  const root = document.documentElement.style;
  Object.keys(merged).forEach(k => root.setProperty('--' + k, merged[k]));
  root.setProperty('--gap', THEME_SPACE[spec.theme] || '20px');
  root.setProperty('--pad', spec.theme === 'graphite-violet' ? '20px' : '26px');
}

/* ---------- 图表渲染 ---------- */
function niceMax(v){
  if (!isFinite(v) || v <= 0) return 10;
  const exp = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / exp;
  const steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (let i = 0; i < steps.length; i++) if (f <= steps[i] + 1e-9) return steps[i] * exp;
  return 10 * exp;
}
function axisTicks(max, count){
  const out = [];
  for (let i = 0; i <= count; i++) out.push(max * i / count);
  return out;
}
function legendHtml(series, highlight){
  return '<div class="legend">' + series.map((s, i) =>
    '<span><i style="background:' + (i === highlight ? 'var(--accent)' : SERIES_COLORS[i % SERIES_COLORS.length]) + '"></i>' + esc(s.name || ('系列' + (i+1))) + '</span>'
  ).join('') + '</div>';
}
function frame(inner, w, h){
  return '<div class="chart"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg></div>';
}

function lineChart(ch){
  const cats = ch.categories || [], series = ch.series || [];
  if (!cats.length || !series.length) return '<div class="empty">暂无数据</div>';
  const W = 940, H = 330, m = {l: 64, r: 24, t: 14, b: 42};
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const vals = [];
  series.forEach(s => (s.data || []).forEach(v => { if (typeof v === 'number' && isFinite(v)) vals.push(v); }));
  const max = niceMax(Math.max.apply(null, vals.length ? vals : [10]));
  const n = cats.length;
  const x = i => m.l + (n === 1 ? pw / 2 : pw * i / (n - 1));
  const y = v => m.t + ph - Math.max(0, Math.min(1, v / max)) * ph;
  let g = '';
  axisTicks(max, 4).forEach(t => {
    g += '<line x1="' + m.l + '" y1="' + y(t).toFixed(1) + '" x2="' + (W - m.r) + '" y2="' + y(t).toFixed(1) +
         '" stroke="var(--line)" stroke-width="1"/>' +
         '<text x="' + (m.l - 10) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end" font-size="12" fill="var(--muted)">' + fmt(t) + '</text>';
  });
  const step = Math.ceil(n / 12);
  cats.forEach((c, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="12" fill="var(--muted)">' + esc(c) + '</text>';
  });
  series.forEach((s, si) => {
    const color = si === ch.highlightSeries ? 'var(--accent)' : SERIES_COLORS[si % SERIES_COLORS.length];
    const pts = []; let seg = [];
    (s.data || []).forEach((v, i) => {
      if (typeof v !== 'number' || !isFinite(v)) { if (seg.length > 1) pts.push(seg); seg = []; return; }
      seg.push([x(i), y(v)]);
    });
    if (seg.length > 1) pts.push(seg);
    pts.forEach(p => {
      g += '<polyline fill="none" stroke="' + color + '" stroke-width="' + (si === 0 ? 2.4 : 1.8) +
           '" stroke-linejoin="round" stroke-linecap="round" points="' + p.map(d => d[0].toFixed(1) + ',' + d[1].toFixed(1)).join(' ') + '"/>';
    });
    if (series.length === 1) {
      (s.data || []).forEach((v, i) => {
        if (typeof v !== 'number' || !isFinite(v)) return;
        g += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3.6" fill="' + color + '"/>';
        if (n <= 12) g += '<text x="' + x(i).toFixed(1) + '" y="' + (y(v) - 12).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">' + fmt(v) + '</text>';
      });
    }
  });
  return legendHtml(series, ch.highlightSeries) + frame(g, W, H);
}

function barChart(ch){
  const cats = ch.categories || [], series = ch.series || [];
  if (!cats.length || !series.length) return '<div class="empty">暂无数据</div>';
  const W = 940, H = 330, m = {l: 64, r: 24, t: 14, b: 42};
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const vals = [];
  series.forEach(s => (s.data || []).forEach(v => { if (typeof v === 'number' && isFinite(v)) vals.push(v); }));
  const max = niceMax(Math.max.apply(null, vals.length ? vals : [10]));
  const n = cats.length, band = pw / n;
  const barW = Math.min(46, band * 0.66 / series.length);
  const gapW = 4;
  const y = v => m.t + ph - Math.max(0, Math.min(1, v / max)) * ph;
  let g = '';
  axisTicks(max, 4).forEach(t => {
    g += '<line x1="' + m.l + '" y1="' + y(t).toFixed(1) + '" x2="' + (W - m.r) + '" y2="' + y(t).toFixed(1) +
         '" stroke="var(--line)" stroke-width="1"/>' +
         '<text x="' + (m.l - 10) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end" font-size="12" fill="var(--muted)">' + fmt(t) + '</text>';
  });
  cats.forEach((c, i) => {
    const cx = m.l + band * (i + 0.5);
    series.forEach((s, si) => {
      const v = s.data ? s.data[i] : null;
      if (typeof v !== 'number' || !isFinite(v)) return;
      const color = (ch.highlightIndex === i && series.length === 1) ? 'var(--accent)' : SERIES_COLORS[si % SERIES_COLORS.length];
      const totalW = series.length * barW + (series.length - 1) * gapW;
      const bx = cx - totalW / 2 + si * (barW + gapW);
      const by = y(v), bh = Math.max(2, m.t + ph - by);
      g += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) +
           '" rx="3" fill="' + color + '"/>';
      if (series.length === 1 || si === 0) {
        g += '<text x="' + (bx + barW / 2).toFixed(1) + '" y="' + (by - 7).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">' + fmt(v) + '</text>';
      }
    });
    g += '<text x="' + cx.toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="12" fill="var(--muted)">' + esc(c) + '</text>';
  });
  return (series.length > 1 ? legendHtml(series, -1) : '') + frame(g, W, H);
}

function hbarChart(ch){
  const cats = ch.categories || [], series = ch.series || [];
  const data = (series[0] && series[0].data) || [];
  if (!cats.length) return '<div class="empty">暂无数据</div>';
  const W = 760, rowH = 52, H = 34 + rowH * cats.length;
  const labelW = 190, valW = 62;
  const x0 = labelW + 8, x1 = W - valW - 12;
  const max = niceMax(Math.max.apply(null, cats.map((_, i) => typeof data[i] === 'number' ? data[i] : 0)));
  let g = '';
  let order = cats.map((c, i) => ({c, v: typeof data[i] === 'number' ? data[i] : 0, i}));
  if (!ch.noSort) order.sort((a, b) => b.v - a.v);
  order.forEach((d, k) => {
    const y = 16 + k * rowH;
    const w = Math.max(2, (d.v / max) * (x1 - x0));
    g += '<text x="' + labelW + '" y="' + (y + 24) + '" text-anchor="end" font-size="15" fill="var(--text)">' + esc(d.c) + '</text>' +
         '<rect x="' + x0 + '" y="' + (y + 8) + '" width="' + (x1 - x0) + '" height="20" rx="4" fill="var(--line)" opacity=".55"/>' +
         '<rect x="' + x0 + '" y="' + (y + 8) + '" width="' + w.toFixed(1) + '" height="20" rx="4" fill="' + (ch.highlightIndex === d.i ? 'var(--accent)' : 'var(--primary)') + '"/>' +
         '<text x="' + (x1 + 8) + '" y="' + (y + 24) + '" font-size="15" font-weight="700" fill="var(--text)">' + fmt(d.v) + '</text>';
  });
  return frame(g, W, H);
}

function donutChart(ch){
  const cats = ch.categories || [], series = ch.series || [];
  const data = (series[0] && series[0].data) || [];
  const total = data.reduce((a, b) => a + (typeof b === 'number' ? b : 0), 0);
  const isPct = String(ch.unit || '') === '%' || Math.abs(total - 100) < 0.001;
  if (!total) return '<div class="empty">暂无数据</div>';
  const W = 720, H = 300, cx = 190, cy = 150, R = 105, r = 62;
  let acc = -Math.PI / 2, g = '';
  cats.forEach((c, i) => {
    const v = typeof data[i] === 'number' ? data[i] : 0;
    const ang = v / total * Math.PI * 2;
    const color = SERIES_COLORS[i % SERIES_COLORS.length];
    const a1 = acc + 0.004, a2 = acc + ang - 0.004;
    const p = (rad, a) => (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2);
    if (ang > 0.0001) {
      g += '<path d="M ' + p(R, a1) + ' A ' + R + ' ' + R + ' 0 0 1 ' + p(R, a2) + ' L ' + p(r, a2) + ' A ' + r + ' ' + r + ' 0 0 0 ' + p(r, a1) + ' Z" fill="' + color + '"/>';
    }
    const mid = acc + ang / 2;
    if (ang > 0.12) {
      g += '<text x="' + (cx + (R + r) / 2 * Math.cos(mid)).toFixed(1) + '" y="' + (cy + (R + r) / 2 * Math.sin(mid) + 5).toFixed(1) +
           '" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">' + (v / total * 100).toFixed(0) + '%</text>';
    }
    acc += ang;
  });
  g += '<text x="' + cx + '" y="' + (cy - 6) + '" text-anchor="middle" font-size="13" fill="var(--muted)">合计</text>' +
       '<text x="' + cx + '" y="' + (cy + 24) + '" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">' + fmt(total) + (isPct ? '%' : '') + '</text>';
  const lx = 368;
  cats.forEach((c, i) => {
    const v = typeof data[i] === 'number' ? data[i] : 0;
    const y = 88 + i * 40;
    g += '<rect x="' + lx + '" y="' + (y - 10) + '" width="12" height="12" rx="3" fill="' + SERIES_COLORS[i % SERIES_COLORS.length] + '"/>' +
         '<text x="' + (lx + 22) + '" y="' + (y + 1) + '" font-size="14" fill="var(--text)">' + esc(c) + '</text>' +
         (isPct
           ? '<text x="' + (W - 40) + '" y="' + (y + 1) + '" text-anchor="end" font-size="14" font-weight="700" fill="var(--text)">' + (typeof v === 'number' ? v.toFixed(1).replace(/\.0$/, '') : '—') + '%</text>'
           : '<text x="' + (W - 30) + '" y="' + (y + 1) + '" text-anchor="end" font-size="14" font-weight="700" fill="var(--text)">' + fmt(v) + '</text>' +
             '<text x="' + (W - 100) + '" y="' + (y + 1) + '" text-anchor="end" font-size="13" fill="var(--muted)">' + (v / total * 100).toFixed(1) + '%</text>');
  });
  return frame(g, W, H);
}

function funnelChart(ch){
  const cats = ch.categories || [], series = ch.series || [];
  const data = (series[0] && series[0].data) || [];
  if (!cats.length) return '<div class="empty">暂无数据</div>';
  const W = 940, rowH = 58, H = 36 + cats.length * rowH;
  const maxW = 300, minW = 56;
  const vals = data.map(v => (typeof v === 'number' ? v : 0));
  const max = Math.max.apply(null, vals) || 1;
  const cx = W / 2;
  const widthOf = v => Math.max(minW, v / max * maxW);
  let g = '';
  cats.forEach((c, i) => {
    const v = vals[i], nx = i < cats.length - 1 ? vals[i + 1] : v;
    const w = widthOf(v), nw = widthOf(nx);
    const y = 18 + i * rowH;
    const color = i === 0 ? 'var(--accent)' : 'var(--primary)';
    g += '<polygon points="' + (cx - w / 2) + ',' + y + ' ' + (cx + w / 2) + ',' + y + ' ' + (cx + nw / 2) + ',' + (y + rowH) + ' ' + (cx - nw / 2) + ',' + (y + rowH) +
         '" fill="' + color + '" opacity="' + (1 - i * 0.16) + '"/>' +
         '<text x="' + (cx - maxW / 2 - 18) + '" y="' + (y + rowH / 2 + 5) + '" text-anchor="end" font-size="15" fill="var(--text)">' + esc(c) + '</text>' +
         '<text x="' + (W - 150) + '" y="' + (y + rowH / 2 + 5) + '" text-anchor="end" font-size="15" font-weight="700" fill="var(--text)">' + fmt(v) + '</text>' +
         (i < cats.length - 1 ? '<text x="' + (W - 34) + '" y="' + (y + rowH / 2 + 5) + '" text-anchor="end" font-size="13" fill="var(--muted)">↓ ' + (nx / (v || 1) * 100).toFixed(1) + '%</text>' : '');
  });
  return frame(g, W, H);
}

function renderChart(ch){
  if (!ch) return '<div class="empty">暂无图表</div>';
  switch (ch.type) {
    case 'line': return lineChart(ch);
    case 'bar': return barChart(ch);
    case 'hbar': return hbarChart(ch);
    case 'donut': return donutChart(ch);
    case 'funnel': return funnelChart(ch);
    default: return '<div class="empty">未支持的图表类型：' + esc(ch.type) + '</div>';
  }
}

/* ---------- 组装 ---------- */
function render(spec){
  applyTheme(spec);
  document.title = spec.title || '数据仪表盘';
  document.getElementById('t-title').textContent = spec.title || '';
  const sub = document.getElementById('t-sub');
  if (spec.subtitle) sub.textContent = spec.subtitle; else sub.style.display = 'none';
  const metaBits = [];
  if (spec.asOf) metaBits.push('数据截至 <b>' + esc(spec.asOf.replace(/^数据截至\s*/, '')) + '</b>');
  if (spec.period) metaBits.push('统计周期 <b>' + esc(spec.period) + '</b>');
  document.getElementById('t-meta').innerHTML = metaBits.join('<br>');
  document.getElementById('t-source').textContent = spec.source ? '数据来源：' + spec.source : '';
  document.getElementById('t-footer').textContent = spec.footer || '数据快照 · 更新请重新生成';

  const kp = document.getElementById('kpis');
  kp.innerHTML = (spec.kpis || []).map(k => {
    const trend = k.trend || 'none';
    const arrow = trend === 'up' ? '▲' : trend === 'down' ? '▼' : '—';
    return '<div class="kpi' + (k.highlight ? ' hl' : '') + '">' +
      '<div class="lab">' + esc(k.label) + '</div>' +
      '<div class="valrow"><span class="val">' + esc(k.value) + '</span>' + (k.unit ? '<span class="unit">' + esc(k.unit) + '</span>' : '') + '</div>' +
      (k.delta ? '<div class="delta ' + trend + '">' + arrow + ' ' + esc(k.delta) + '</div>' : '') +
      (k.note ? '<div class="note">' + esc(k.note) + '</div>' : '') +
      '</div>';
  }).join('');

  const grid = document.getElementById('grid');
  const needSpan = sec => {
    if (sec.span === 1 || sec.span === 2) return sec.span === 2;
    const ch = sec.chart || {};
    const cats = (ch.categories || []).length;
    if (ch.type === 'line' || ch.type === 'bar') return cats > 8;
    if (ch.type === 'funnel') return cats >= 4;
    return false;
  };
  grid.innerHTML = (spec.sections || []).map(sec => {
    const ro = sec.readout || {};
    return '<section class="card' + (needSpan(sec) ? ' span2' : '') + '">' +
      '<h2>' + esc(sec.title) + '</h2>' +
      (sec.subtitle ? '<div class="cap">' + esc(sec.subtitle) + '</div>' : '') +
      renderChart(sec.chart) +
      '<div class="readout">' +
      (ro.conclusion ? '<div class="r"><span class="tag c">结论</span><span>' + esc(ro.conclusion) + '</span></div>' : '') +
      (ro.evidence ? '<div class="r"><span class="tag">证据</span><span>' + esc(ro.evidence) + '</span></div>' : '') +
      (ro.boundary ? '<div class="r"><span class="tag">边界</span><span>' + esc(ro.boundary) + '</span></div>' : '') +
      '</div></section>';
  }).join('');
}

render(DASHBOARD);
</script>
</body>
</html>
